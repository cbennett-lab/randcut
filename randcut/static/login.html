<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymClass — Sign in</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0ede8;
    --card: #ffffff;
    --border: #d8d3cc;
    --dark: #1a1a1a;
    --accent2: #d45a1a;
    --muted: #8a847c;
  }

  body {
    background: var(--bg); color: var(--dark);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 44px 40px;
    width: 100%; max-width: 420px; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.06);
  }

  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; letter-spacing: 2px; line-height: 1.05;
    margin-bottom: 6px;
  }
  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 32px;
  }

  .signin {
    display: flex; align-items: center; justify-content: center; gap: 11px;
    width: 100%; padding: 15px 20px;
    background: var(--dark); color: #fff;
    border: 1px solid var(--dark); border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 19px; letter-spacing: 3px;
    text-decoration: none; cursor: pointer; transition: all 0.15s;
  }
  .signin:hover { background: #2e2e2e; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,0.14); }
  .signin svg { width: 18px; height: 18px; flex-shrink: 0; }

  .note {
    font-size: 12px; color: var(--muted);
    margin-top: 20px; line-height: 1.55;
  }

  .error {
    background: rgba(212,90,26,0.08); border-left: 2px solid var(--accent2);
    border-radius: 0 6px 6px 0; padding: 11px 14px;
    font-size: 13px; color: var(--dark);
    margin-bottom: 24px; text-align: left;
  }
  .error.hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">GYMCLASS<br>VIDEO CLIPPER</div>
  <div class="tagline">Sign in to continue</div>

  <div class="error hidden" id="error"></div>

  <a class="signin" href="/auth/login">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 11v2.4h5.7c-.23 1.2-1.45 3.5-5.7 3.5-3.43 0-6.23-2.84-6.23-6.35S8.57 4.2 12 4.2c1.95 0 3.26.83 4.01 1.55l1.73-1.67C16.63 3.03 14.53 2 12 2 6.98 2 3 5.98 3 11s3.98 9 9 9c5.2 0 8.63-3.65 8.63-8.8 0-.6-.06-1.05-.14-1.5H12z"/></svg>
    Sign in with Google
  </a>

  <div class="note">
    Restricted to GymClass accounts. Signing in also grants the app read access
    to the shared content folder on Drive.
  </div>
</div>

<script>
  const err = new URLSearchParams(location.search).get('error');
  if (err) {
    const box = document.getElementById('error');
    box.textContent = err;
    box.classList.remove('hidden');
  }
</script>
</body>
</html>
